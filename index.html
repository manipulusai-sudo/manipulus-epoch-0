    <style>/* MANIPULUS EPOCH 0 STYLE */
:root {
    --bg-color: #050505;
    --panel-bg: rgba(10, 10, 10, 0.9);
    --grid-line: rgba(50, 255, 50, 0.05);
    --text-primary: #e0e0e0;
    --text-dim: #555;

    /* STATES */
    --state-idle: #555555;
    --state-observing: #ffaa00;
    /* Orange */
    --state-validating: #ffee00;
    /* Yellow */
    --state-triggered: #00ff00;
    /* Green */
    --state-error: #ff3333;

    --font-stack: 'Courier New', Courier, monospace;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
}

body {
    background-color: var(--bg-color);
    color: var(--text-primary);
    font-family: var(--font-stack);
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    background-image:
        linear-gradient(var(--grid-line) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
    background-size: 40px 40px;
}

/* HUD LAYOUT */
.hud-container {
    display: flex;
    flex-direction: column;
    height: 100%;
}

.hud-header {
    background: rgba(0, 0, 0, 0.8);
    border-bottom: 1px solid #333;
    padding: 10px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    backdrop-filter: blur(4px);
    z-index: 10;
}

h1 {
    font-size: 1.1rem;
    letter-spacing: 2px;
    font-weight: normal;
}

.sub-label {
    font-size: 0.6rem;
    color: var(--text-dim);
    letter-spacing: 1px;
}

.status-indicator {
    font-size: 0.7rem;
    color: var(--state-idle);
    display: flex;
    align-items: center;
    gap: 8px;
    border: 1px solid #333;
    padding: 4px 8px;
}

.status-dot {
    width: 6px;
    height: 6px;
    background: var(--state-idle);
    border-radius: 50%;
}

.status-dot.active {
    background: var(--state-triggered);
    box-shadow: 0 0 8px var(--state-triggered);
}

/* VIEWPORT */
.viewport {
    flex: 1;
    position: relative;
    background: #000;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
}

.sensor-feed {
    width: 100%;
    height: 100%;
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* Video is hidden, we render to canvas */
video {
    position: absolute;
    /* Keep minimal visibility to prevent browser optimization stopping playback */
    width: 100px;
    height: 100px;
    opacity: 0.01;
    z-index: -1;
    pointer-events: none;
}

#video {
    opacity: 0;
}

canvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    /* We handle mirroring in JS draw logic, OR we mirror canvas here? */
    /* If we flip canvas here, then our drawing logic needs to be normal. */
    /* JS uses scale(-1, 1). So duplicate flush? */
    /* Let's NOT flip canvas via CSS if JS handles it. */
    /* But previously we flipped scaleX(-1). */
    /* Our JS logic assumes we draw mirrored. */
    /* If canvas is normal, user sees mirrored. */
    /* So remove local transform. */
}

/* FSM OVERLAY & RETICLE */
.fsm-overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 5;
}

.reticle {
    position: absolute;
    width: 100px;
    height: 100px;
    border: 1px solid rgba(255, 255, 255, 0.1);
    transform: translate(-50%, -50%);
    /* Centered on coord */
    transition: width 0.1s, height 0.1s, border-color 0.2s;
}

.reticle.hidden {
    opacity: 0;
}

.reticle-corner {
    position: absolute;
    width: 10px;
    height: 10px;
    border-color: var(--state-idle);
    border-style: solid;
    transition: border-color 0.2s;
}

.tl {
    top: -1px;
    left: -1px;
    border-width: 2px 0 0 2px;
}

.tr {
    top: -1px;
    right: -1px;
    border-width: 2px 2px 0 0;
}

.bl {
    bottom: -1px;
    left: -1px;
    border-width: 0 0 2px 2px;
}

.br {
    bottom: -1px;
    right: -1px;
    border-width: 0 2px 2px 0;
}

/* STATE STYLES */
.reticle[data-state="OBSERVING"] .reticle-corner {
    border-color: var(--state-observing);
}

.reticle[data-state="VALIDATING"] .reticle-corner {
    border-color: var(--state-validating);
}

.reticle[data-state="TRIGGERED"] .reticle-corner {
    border-color: var(--state-triggered);
}

/* VALIDATION RING */
.validation-ring {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    transform: rotate(-90deg);
}

.ring-bg {
    fill: none;
    stroke: rgba(255, 255, 255, 0.1);
    stroke-width: 4;
}

.ring-progress {
    fill: none;
    stroke: var(--state-validating);
    stroke-width: 4;
    stroke-dasharray: 283;
    /* 2 * PI * 45 */
    stroke-dashoffset: 283;
}

/* CENTER TEXT */
.center-status {
    position: absolute;
    bottom: 20%;
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
    width: 100%;
}

.fsm-state {
    font-size: 1.5rem;
    font-weight: bold;
    color: var(--state-idle);
    text-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
    letter-spacing: 4px;
    margin-bottom: 5px;
}

.fsm-detail {
    font-size: 0.8rem;
    color: var(--text-dim);
    letter-spacing: 2px;
}

/* FOOTER */
.hud-footer {
    background: #000;
    border-top: 1px solid #333;
    padding: 10px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 10;
}

.hud-btn {
    background: transparent;
    border: 1px solid var(--state-triggered);
    color: var(--state-triggered);
    padding: 10px 20px;
    font-family: var(--font-stack);
    font-size: 0.9rem;
    cursor: pointer;
    transition: all 0.2s;
    text-transform: uppercase;
    letter-spacing: 1px;
}

.hud-btn:hover {
    background: rgba(0, 255, 0, 0.1);
    box-shadow: 0 0 10px var(--state-triggered);
}

.hud-btn.dim {
    border-color: #555;
    color: #888;
}

.hud-btn.dim:hover {
    border-color: #888;
    color: #bbb;
}

.system-readout {
    font-size: 0.7rem;
    color: #555;
    display: flex;
    gap: 15px;
}

/* MODAL */
.modal {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.8);
    backdrop-filter: blur(5px);
    z-index: 100;
    display: flex;
    justify-content: center;
    align-items: center;
}

.modal.hidden {
    display: none;
}

.modal-content {
    background: #111;
    border: 1px solid #333;
    width: 90%;
    max-width: 600px;
    height: 80%;
    display: flex;
    flex-direction: column;
    padding: 20px;
    box-shadow: 0 0 30px #000;
}

.modal-header {
    display: flex;
    justify-content: space-between;
    margin-bottom: 20px;
    border-bottom: 1px solid #333;
    padding-bottom: 10px;
}

.close-btn {
    background: none;
    border: none;
    color: #fff;
    font-size: 1.2rem;
    cursor: pointer;
}

.ledger-list {
    flex: 1;
    overflow-y: auto;
    font-size: 0.8rem;
    color: #aaa;
    border: 1px solid #222;
    padding: 10px;
    margin-bottom: 20px;
    font-family: monospace;
}

.ledger-item {
    border-bottom: 1px solid #222;
    padding: 8px 0;
    display: flex;
    justify-content: space-between;
}

.ledger-hash {
    color: var(--text-dim);
    font-size: 0.7rem;
}

.full-width {
    width: 100%;
}

/* SOVEREIGN ANALYTICS TOGGLE */
.analytics-toggle {
    position: fixed;
    bottom: 80px;
    /* Above Footer */
    right: 20px;
    z-index: 100;
}

.analytics-btn {
    background: rgba(0, 0, 0, 0.9);
    border: 1px solid #333;
    color: #666;
    padding: 8px 14px;
    cursor: pointer;
    font-family: var(--font-stack);
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    transition: all 0.3s ease;
    display: flex;
    align-items: center;
    gap: 6px;
    backdrop-filter: blur(4px);
}

.analytics-btn:hover {
    border-color: #444;
    color: #888;
}

.analytics-btn.active {
    border-color: var(--state-triggered);
    color: var(--state-triggered);
    box-shadow: 0 0 15px rgba(0, 255, 0, 0.2);
}

.analytics-dot {
    width: 6px;
    height: 6px;
    background: #333;
    border-radius: 50%;
    transition: background 0.3s;
}

.analytics-btn.active .analytics-dot {
    background: var(--state-triggered);
    box-shadow: 0 0 8px var(--state-triggered);
}

.analytics-panel {
    position: absolute;
    bottom: 40px;
    right: 0;
    background: rgba(10, 10, 10, 0.95);
    border: 1px solid #333;
    padding: 16px 20px;
    min-width: 200px;
    display: none;
    flex-direction: column;
    gap: 12px;
    backdrop-filter: blur(10px);
    box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
}

.analytics-panel.open {
    display: flex;
}

.analytics-header {
    font-size: 0.65rem;
    color: #444;
    text-transform: uppercase;
    letter-spacing: 2px;
    border-bottom: 1px solid #1a1a1a;
    padding-bottom: 8px;
}

.analytics-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.analytics-label {
    font-size: 0.75rem;
    color: #666;
}

.analytics-count {
    font-size: 1rem;
    color: var(--state-triggered);
    font-weight: bold;
    font-family: monospace;
}</style>

    <script>/* MANIPULUS EPOCH 0 CORE LOGIC */



// --- CONFIG ---
const CONFIG = {
    validationTime: 800, // ms
    coolDownTime: 2000,
    minScore: 0.85,
    iouThreshold: 0.5
};

// --- FSM STATES ---
const STATE = {
    IDLE: 'IDLE',
    OBSERVING: 'OBSERVING',
    VALIDATING: 'VALIDATING',
    TRIGGERED: 'TRIGGERED',
    COOL_DOWN: 'COOL_DOWN'
};

let currentState = STATE.IDLE;
let validateStartTime = 0;
let triggeredTime = 0;
let model = null;
let isVideo = false;


// DOM Elements
const video = document.getElementById('video');
const canvas = document.getElementById('output');
const ctx = canvas.getContext('2d');

// Canvas Auto-Resize
function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

const elReticle = document.getElementById('reticle');
const elRing = document.getElementById('ring-progress');
const elState = document.getElementById('fsm-state');
const elDetail = document.getElementById('fsm-detail');
const elStatusDot = document.getElementById('connection-dot');
const elStatusText = document.getElementById('connection-text');
const btnToggle = document.getElementById('btn-toggle-cam');
const elFps = document.getElementById('fps-counter');

// --- SOVEREIGN LEDGER (IndexedDB) ---
let db;
const DB_NAME = 'manipulus_ledger_v1';
const STORE_NAME = 'sovereign_events';

function initLedger() {
    const request = indexedDB.open(DB_NAME, 1);
    request.onupgradeneeded = (e) => {
        db = e.target.result;
        if (!db.objectStoreNames.contains(STORE_NAME)) {
            db.createObjectStore(STORE_NAME, { keyPath: 'id' });
        }
    };
    request.onsuccess = (e) => {
        db = e.target.result;
        console.log("SOVEREIGN LEDGER: MOUNTED");
        updateLedgerUI();
    };
    request.onerror = (e) => {
        console.error("LEDGER ERROR", e);
    };
}

function logEvent(type, confidence) {
    if (!db) return;
    const tx = db.transaction([STORE_NAME], 'readwrite');
    const store = tx.objectStore(STORE_NAME);

    // Generate simple hash
    const noise = Math.random().toString(36).substring(7);
    const hash = btoa(`${Date.now()}-${type}-${noise}`).substring(0, 16);

    const event = {
        id: Date.now(),
        timestamp: new Date().toISOString(),
        type: type,
        confidence: confidence.toFixed(4),
        hash: hash
    };

    store.add(event);
    updateLedgerUI();
}

function getLedger(callback) {
    if (!db) return;
    const tx = db.transaction([STORE_NAME], 'readonly');
    const store = tx.objectStore(STORE_NAME);
    const request = store.getAll();
    request.onsuccess = () => {
        // Sort DESC
        const res = request.result.sort((a, b) => b.id - a.id);
        callback(res);
    };
}

// --- FSM ENGINE ---

function transition(newState) {
    if (currentState === newState) return;

    // Exit Logic
    if (currentState === STATE.VALIDATING) {
        // Reset ring if we leave validating without triggering
        if (newState !== STATE.TRIGGERED) {
            elRing.style.strokeDashoffset = 283;
        }
    }

    currentState = newState;
    elReticle.setAttribute('data-state', newState);

    // Entry Logic
    if (newState === STATE.IDLE) {
        elState.innerText = "SYSTEM IDLE";
        elDetail.innerText = "WAITING FOR KINETIC INPUT";
        elState.style.color = "var(--state-idle)";
        elReticle.classList.add('hidden');
    } else if (newState === STATE.OBSERVING) {
        elState.innerText = "OBSERVING";
        elDetail.innerText = "TRACKING TARGET VECTOR";
        elState.style.color = "var(--state-observing)";
        elReticle.classList.remove('hidden');
    } else if (newState === STATE.VALIDATING) {
        elState.innerText = "VALIDATING";
        elDetail.innerText = "HOLD POSE TO UNLOCK";
        elState.style.color = "var(--state-validating)";
        validateStartTime = Date.now();
    } else if (newState === STATE.TRIGGERED) {
        elState.innerText = "ACCESS GRANTED";
        elDetail.innerText = "KINETIC SIGNATURE VERIFIED";
        elState.style.color = "var(--state-triggered)";
        elStatusDot.classList.add('active');
        logEvent("KINETIC_TRIGGER", 0.99);
        trackEvent('Intent Validated'); // ANALYTICS

        triggeredTime = Date.now();
        setTimeout(() => transition(STATE.COOL_DOWN), 100);
    } else if (newState === STATE.COOL_DOWN) {
        elReticle.classList.add('hidden');
        elStatusDot.classList.remove('active');
        // Wait then reset
        setTimeout(() => transition(STATE.IDLE), CONFIG.coolDownTime);
    }
}

function updateFSM(predictions) {
    if (currentState === STATE.COOL_DOWN || currentState === STATE.TRIGGERED) return;

    // No target?
    if (!predictions || predictions.length === 0) {
        if (currentState !== STATE.IDLE) transition(STATE.IDLE);
        return;
    }

    const hand = predictions[0];
    const score = hand.score;
    const [x, y, w, h] = hand.bbox;

    // We rely on renderVideoToCanvas to have prepared proper visual dimensions
    // We recreate them here for mapping. This is redundant but safe.
    // Or we could store them globally. Let's recalculate.

    const vW = video.videoWidth;
    const vH = video.videoHeight;
    const cw = canvas.width;
    const ch = canvas.height;

    // We need "offX", "offY", "visualW", "visualH"
    const rVid = vW / vH;
    const rCan = cw / ch;

    let visualW, visualH, offX, offY;

    if (rCan > rVid) {
        // Canvas wider -> Pillarbox
        visualH = ch;
        visualW = ch * rVid;
        offY = 0;
        offX = (cw - visualW) / 2;
    } else {
        // Canvas taller -> Letterbox
        visualW = cw;
        visualH = cw / rVid;
        offX = 0;
        offY = (ch - visualH) / 2;
    }

    // Normalized Hand Coords (0-1) in Source Video
    const cx = x + w / 2;
    const cy = y + h / 2;
    const nx = cx / vW;
    const ny = cy / vH;

    // Screen Mapping (Canvas Coordinates)
    // We draw mirrored. 
    // If nx=0 (left of video), we draw it at RIGHT of canvas if mirrored?
    // Wait. ctx.scale(-1, 1).
    // drawImage(img, 0, 0) draws at top-right (x=0 in flipped system).
    // So visual left edge of source = visual right edge of output?
    // User MIRROR expectation:
    // Move REAL RIGHT hand (Screen Right). 
    // Camera sees LEFT side of frame.
    // nx ~ 0.
    // We want reticle at Screen Right.
    // Screen X = offX + ((1-nx) * visualW) ??
    // If nx=0, screenX = offX + visualW. (Right side).
    // Yes. ((1-nx) * visualW) gives the x-coord from left edge for mirrored.

    const screenX = offX + ((1 - nx) * visualW);
    const screenY = offY + (ny * visualH);

    elReticle.style.left = `${screenX}px`;
    elReticle.style.top = `${screenY}px`;

    // State Logic
    if (currentState === STATE.IDLE) {
        if (score > CONFIG.minScore) transition(STATE.OBSERVING);
    }
    else if (currentState === STATE.OBSERVING) {
        if (score < CONFIG.minScore - 0.1) transition(STATE.IDLE);

        // STRICT WHITELIST
        if (['open', 'closed', 'hand'].includes(hand.label)) {
            transition(STATE.VALIDATING);
        }
    }
    else if (currentState === STATE.VALIDATING) {
        const validGesture = ['open', 'closed', 'hand'].includes(hand.label);
        if (score < CONFIG.minScore - 0.1 || !validGesture) {
            transition(STATE.OBSERVING);
            return;
        }

        // Update Progress
        const elapsed = Date.now() - validateStartTime;
        const progress = Math.min(elapsed / CONFIG.validationTime, 1);

        // 283 is circle circumference
        const offset = 283 - (283 * progress);
        elRing.style.strokeDashoffset = offset;

        if (progress >= 1.0) {
            transition(STATE.TRIGGERED);
        }
    }
}


// --- VISION LOOP ---
const modelParams = {
    flipHorizontal: true,   // flip e.g for video 
    maxNumBoxes: 1,
    iouThreshold: 0.5,
    scoreThreshold: 0.6,
};

function initSensor() {
    handTrack.startVideo(video).then(status => {
        if (status) {
            isVideo = true;
            btnToggle.innerText = "TERMINATE SENSOR";
            runDetection();
        } else {
            elState.innerText = "SENSOR_FAIL";
        }
    });
}

function killSensor() {
    handTrack.stopVideo(video);
    isVideo = false;
    btnToggle.innerText = "INIT SENSOR";
    transition(STATE.IDLE);
}

function renderVideoToCanvas() {
    const vW = video.videoWidth;
    const vH = video.videoHeight;
    if (!vW || !vH) return;

    const cw = canvas.width;
    const ch = canvas.height;

    const rVid = vW / vH;
    const rCan = cw / ch;

    let w, h, x, y;

    if (rCan > rVid) {
        h = ch;
        w = ch * rVid;
        y = 0;
        x = (cw - w) / 2;
    } else {
        w = cw;
        h = cw / rVid;
        x = 0;
        y = (ch - h) / 2;
    }

    // Clear
    ctx.clearRect(0, 0, cw, ch);

    // Draw Mirrored
    ctx.save();
    ctx.translate(cw, 0);
    ctx.scale(-1, 1);

    // Draw centered
    // In flipped context, origin is right. Positive X goes left.
    // If we want to draw at visual 'x' (from left edge), that is 'cw - x' from right?
    // No, standard flip: x becomes cw-x.
    // We want the IMAGE to be flipped.
    // drawImage(video, x, y, w, h). 
    // This draws image normally at that rect?
    // If we flipped the context, the image is drawn flipped.
    // But WHERE is it drawn?
    // If we effectively want to draw at 'x' from Left Edge (visual), 
    // In flipped context, that rect corresponds to drawing at 'x' from origin?
    // Let's test: x=0. Draw at 0. Result is at Right edge? 
    // Yes.
    // If we want to center the MIRRORED image.
    // The "pillarbox" means we want black bars.
    // The image should be in the center.
    // Visually center = x .. x+w.
    // In flipped context, x .. x+w is same numeric range, but results in visual cw-x .. cw-(x+w)?
    // Basically, we draw at 'x, y' in flipped context.
    // It will appear at 'cw-(x+w)'? No.
    // Symmetrical centering means x = (cw-w)/2.
    // Drawing at x in flipped context puts it at same offset from right.
    // (cw - w)/2 from right IS (cw-w)/2 from left if symmetrical.
    // So YES, we draw at x, y, w, h.

    ctx.drawImage(video, 0, 0, vW, vH, x, y, w, h);

    ctx.restore();
}

let lastFrame = 0;
function runDetection() {
    model.detect(video).then(predictions => {
        renderVideoToCanvas();
        updateFSM(predictions);

        const now = Date.now();
        const delta = now - lastFrame;
        lastFrame = now;
        elFps.innerText = Math.round(1000 / delta);

        if (isVideo) requestAnimationFrame(runDetection);

    });
}

async function trackEvent(eventType) {

    try {

        console.log(`[ANALYTICS] Tracked: ${eventType}`);

async function fetchAnalyticsCounts() {
    if (!supabaseClient) return { arrivals: '?', intents: '?' };
    try {
        const { data, error } = await supabaseClient.from('analytics_epoch_0').select('event_type');
        if (error) return { arrivals: '?', intents: '?' };
        const arrivals = data.filter(e => e.event_type === 'Arrival').length;
        const intents = data.filter(e => e.event_type === 'Intent Validated').length;
        return { arrivals, intents };
    } catch (err) {
        return { arrivals: '?', intents: '?' };
    }
}
